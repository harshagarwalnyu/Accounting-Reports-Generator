name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: |
          cd backend
          uv sync --extra dev
      - name: Lint with ruff
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .
      - name: Run tests
        run: |
          cd backend
          uv run pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile
      - name: Build
        run: |
          cd frontend
          bun run build
