[project]
name = "api"
version = "0.2.0"
description = "Accounting Reports Generator API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.22",
    "sse-starlette>=3.3.2",
    "uvicorn>=0.41.0",
    "anthropic>=0.40.0",
    "pymupdf>=1.25.0",
    "scikit-image>=0.25.0",
    "imagehash>=4.3.2",
    "Pillow>=11.0.0",
    "babel>=2.16.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "docxtpl>=0.16.0",
    "pdfplumber>=0.11.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.5",
]

[tool.setuptools]
py-modules = []
[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/pytest_cache"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
